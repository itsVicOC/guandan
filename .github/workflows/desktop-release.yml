name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-desktop:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: windows-x64
          - os: ubuntu-22.04
            asset: linux-x64
          - os: macos-15-intel
            asset: macos-x64
          - os: macos-15
            asset: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install -e ".[gui,packaging]"
      - name: Build desktop application
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --windowed
          --onedir
          --name Guandan
          --collect-data guandan.ai.profiles
          packaging/guandan_gui.py
      - name: Smoke test packaged application
        run: python packaging/smoke_desktop.py
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path dist/Guandan -DestinationPath "release-assets/Guandan-${env:RELEASE_TAG}-windows-x64.zip"
      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          tar -C dist -czf "release-assets/Guandan-${RELEASE_TAG}-linux-x64.tar.gz" Guandan
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent dist/Guandan.app "release-assets/Guandan-${RELEASE_TAG}-${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Build Python wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes" --prerelease
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --notes-file "$notes" --prerelease
          fi
