name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q

  visual-smoke:
    name: Visual smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      GUANDAN_TUI_NO_RESIZE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install package and visual dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Capture and verify GUI/TUI states
        run: python scripts/capture_visual_qa.py --output visual-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ runner.os }}
          path: visual-artifacts
          if-no-files-found: error
