name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests scripts packaging
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q

  benchmark-gate:
    name: Benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compare against the checked-in baseline
        run: |
          python -m guandan.ai.benchmark \
            --games 20 \
            --difficulties 0,1,2,3 \
            --seed-start 800 \
            --max-turns 2000 \
            --json > current.json
          python -m guandan.ai.benchmark \
            --compare benchmarks/v0.8.2b1-mixed-20.json current.json \
            --fail-completion-drop 0.05 \
            --fail-bomb-drift 0.4 \
            --json
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: current.json
          if-no-files-found: warn

  visual-smoke:
    name: Visual smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      GUANDAN_TUI_NO_RESIZE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - name: Install package and visual dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Capture and verify GUI/TUI states
        run: python scripts/capture_visual_qa.py --output visual-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ runner.os }}
          path: visual-artifacts
          if-no-files-found: error
