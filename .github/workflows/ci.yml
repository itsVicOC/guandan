name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - name: Install locked test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra gui
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts packaging
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest --cov=guandan --cov-report=term-missing --cov-report=xml --cov-report=json -q
      - name: Check recovery boundary coverage
        run: uv run --no-sync python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json

  benchmark-gate:
    name: Benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12 --extra dev
      - name: Check fixed-work decisions against the current baseline
        run: >-
          uv run --no-sync python -m guandan.ai.diagnostics
          --mode fixed --baseline benchmarks/ai-regression-v6.json --output current.json
      - name: Verify a complete match and its event streams
        run: uv run --no-sync python -m guandan.ai.benchmark --full-match --difficulties 0 --json
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: current.json
          if-no-files-found: warn

  visual-smoke:
    name: Visual smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      GUANDAN_TUI_NO_RESIZE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - name: Install locked visual dependencies
        run: uv sync --locked --python 3.12 --extra dev --extra gui
      - name: Capture and verify GUI/TUI states
        run: uv run --no-sync python scripts/capture_visual_qa.py --output visual-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ runner.os }}
          path: visual-artifacts
          if-no-files-found: error
