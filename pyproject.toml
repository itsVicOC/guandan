[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guandan"
version = "0.7.0b1"
description = "本地掼蛋游戏（终端 TUI），5 档 AI 含致敬戴长胜牌风"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vic" }]
keywords = ["guandan", "card-game", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "textual>=0.60",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
guandan = "guandan.tui.app:run"
guandan-cli = "guandan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"guandan.ai.profiles" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: property-based tests that take a while",
]

[tool.coverage.run]
source = ["src/guandan"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line-length
    "RUF001",  # 中文文本
    "RUF002",  # 中文文本
    "RUF003",  # 中文文本
    "RUF012",  # Textual BINDINGS
    "SIM117",  # nested context managers are clearer in storage tests
    "UP006",   # keep Python 3.9-compatible typing style
    "UP035",   # keep Python 3.9-compatible typing imports
    "UP045",   # PEP 604 requires Python 3.10+
]

[tool.mypy]
python_version = "3.9"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]
